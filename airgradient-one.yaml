# AirGradient ONE - Board v9
# https://www.airgradient.com/open-airgradient/instructions/overview/

substitutions:
  name: "ag-one"
  friendly_name: "AG One"
  name_add_mac_suffix: "false"  # Must have quotes around value

# Enable Home Assistant API
api:  # Add encryption key as desired

ota:  # Add password as desired
  platform: esphome
  # password:

wifi:

dashboard_import:
  package_import_url: github://librick/airgradient_esphome/airgradient-one.yaml@test-recursion-v2
  import_full_config: false

packages:
  board: github://librick/airgradient_esphome/packages/airgradient_esp32-c3_board.yaml@test-recursion-v2
  captive_portal: github://librick/airgradient_esphome/packages/captive_portal.yaml@test-recursion-v2
  pm_2.5: github://librick/airgradient_esphome/packages/sensor_pms5003.yaml@test-recursion-v2
  co2: github://librick/airgradient_esphome/packages/sensor_s8.yaml@test-recursion-v2
  temp_humidity: github://librick/airgradient_esphome/packages/sensor_sht40.yaml@test-recursion-v2
  tvoc: github://librick/airgradient_esphome/packages/sensor_sgp41.yaml@test-recursion-v2
  display: github://librick/airgradient_esphome/packages/display_sh1106_multi_page.yaml@test-recursion-v2
  led: github://librick/airgradient_esphome/packages/led.yaml@test-recursion-v2
  led_co2: github://librick/airgradient_esphome/packages/led_co2.yaml@test-recursion-v2
  airgradient_api: github://librick/airgradient_esphome/packages/airgradient_api_esp32-c3.yaml@test-recursion-v2
  hardware_watchdog: github://librick/airgradient_esphome/packages/watchdog.yaml@test-recursion-v2
  config_button: github://librick/airgradient_esphome/packages/config_button.yaml@test-recursion-v2
  wifi: github://librick/airgradient_esphome/packages/sensor_wifi.yaml@test-recursion-v2
  uptime: github://librick/airgradient_esphome/packages/sensor_uptime.yaml@test-recursion-v2

binary_sensor:
  - id: !extend config_button
    pin:
      ignore_strapping_warning: true  # Acknowledging that this is a strapping pin and should not have external pullup/down resistors  https://esphome.io/guides/faq.html#why-am-i-getting-a-warning-about-strapping-pins
